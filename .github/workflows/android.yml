name: Build Android APK

# Produces an installable debug APK for testing the real native app.
#
# This runs in CI rather than locally on purpose: GitHub's Ubuntu runners ship
# the Android SDK and a modern JDK already, and they check out to a clean path.
# Gradle refuses directory names containing "&", which rules out building from
# the folder this project lives in on the author's machine.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/refresh-food-db.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # Capacitor 8's Gradle plugin needs a current JDK; the runner default is
      # older than that.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # The bundled core dataset. Reuses whatever the deploy workflow cached so
      # this job does not download the USDA export a second time.
      - name: Restore food data
        id: fooddb-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/fooddb
            public/data/core-foods.json
          key: fooddb-${{ vars.FOOD_DB_VERSION || 'v1' }}
          restore-keys: fooddb-

      - name: Build core dataset if the cache was empty
        if: steps.fooddb-cache.outputs.cache-matched-key == ''
        run: |
          node scripts/fetch-usda.mjs --out=data-build/usda
          node scripts/build-core-db.mjs --usda=data-build/usda

      # The hosted database is far too large to ship inside an APK, so the
      # native app reads it from the Pages deployment over range requests —
      # exactly as the web build does. Everything else works offline.
      - name: Build web bundle
        env:
          VITE_FOOD_DB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/fooddb/
        run: |
          # Deliberately no VITE_BASE: Capacitor serves from the root of a local
          # origin, and the "/<repo>/" base used for Pages would break every
          # asset path inside the shell.
          rm -rf public/fooddb
          npm run build

      - name: Add the Android platform
        run: |
          npx cap add android
          # Must run before sync: the camera plugins do not declare CAMERA
          # themselves, so without this the app silently has no camera access.
          node scripts/patch-android-manifest.mjs
          # The generated theme leaves the navigation bar at the platform
          # default — a light grey strip with dark icons under a dark app.
          node scripts/patch-android-theme.mjs
          npx cap sync android

      - name: Verify the manifest declares camera access
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST" || {
            echo "::error::CAMERA permission missing from $MANIFEST"
            exit 1
          }
          echo "CAMERA permission present."

      - name: Validate the generated Android resources
        # These are inflated before any app code runs, so a mistake here is a
        # process that dies on launch, not a visual bug. Gradle compiles them
        # regardless — only a device shows the failure.
        run: node scripts/check-android-resources.mjs

      - name: Verify the system chrome was themed
        run: |
          STYLES=android/app/src/main/res/values/styles.xml
          grep -q 'android:navigationBarColor' "$STYLES" || {
            echo "::error::navigationBarColor missing from $STYLES — the nav bar will render in the platform default"
            exit 1
          }
          test -f android/app/src/main/res/values-night/styles.xml || {
            echo "::error::values-night/styles.xml missing — dark mode would keep light system bars"
            exit 1
          }
          echo "System chrome themed."

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the artifact
        id: name
        run: |
          APK=$(find android -name '*-debug.apk' | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "size=$(du -h "$APK" | cut -f1)" >> $GITHUB_OUTPUT
          cp "$APK" fuelflow-debug.apk

      - uses: actions/upload-artifact@v5
        with:
          name: fuelflow-apk
          path: fuelflow-debug.apk
          retention-days: 30

      # A release asset has a plain public URL, which is the only practical way
      # to get an APK onto a phone — artifact downloads require a signed-in
      # GitHub session and arrive as a zip.
      - name: Publish to the rolling preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Written via a heredoc rather than inline: a multi-line --notes string
          # puts lines at column zero, which ends the YAML block scalar early and
          # makes the whole workflow unparseable.
          cat > notes.md <<'NOTES'
          Debug APK for testing the native app.

          **Install:** download this file on your phone, then allow installation
          from unknown sources when prompted.

          Debug-signed and unoptimised — for testing, not for the Play Store.
          Everything works offline except branded-product lookups, which stream
          from the hosted database over HTTP range requests.
          NOTES
          sed -i 's/^          //' notes.md
          echo "" >> notes.md
          echo "Built from \`${GITHUB_SHA::7}\`." >> notes.md

          gh release delete preview --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create preview fuelflow-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "FuelFlow preview build" \
            --prerelease \
            --notes-file notes.md

      - name: Summary
        run: |
          echo "### APK ready" >> $GITHUB_STEP_SUMMARY
          echo "Size: ${{ steps.name.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/preview/fuelflow-debug.apk" >> $GITHUB_STEP_SUMMARY
