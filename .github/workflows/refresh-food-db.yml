name: Refresh hosted food database

# Rebuilds the hosted snapshot from the Open Food Facts bulk export (and USDA,
# when USDA_CSV_URL is set) and replaces the deploy workflow's cache, then
# redeploys. Monthly is about right: Open Food Facts gains products
# continuously, but the live API fallback in the app already covers anything
# newer than the snapshot.
on:
  schedule:
    - cron: '0 4 1 * *' # 04:00 UTC on the first of the month
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to rebuild'
        type: choice
        default: core-only
        options:
          - core-only
          - everything

permissions:
  contents: read
  actions: write

concurrency:
  group: food-db
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # The Open Food Facts export is roughly a gigabyte compressed and parsing it
    # is single-pass but not fast. Give it room rather than failing at minute 359.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # A core-only rebuild still has to republish the hosted snapshot, so the
      # previous one is restored and passed straight back through.
      - name: Restore the previous food database
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'core-only'
        uses: actions/cache/restore@v4
        with:
          path: |
            public/fooddb
            public/data/core-foods.json
          key: fooddb-${{ vars.FOOD_DB_VERSION || 'v1' }}
          restore-keys: fooddb-

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      # One public download, no API key, feeding both datasets.
      - name: Fetch the USDA export
        run: node scripts/fetch-usda.mjs --out=data-build/usda

      - name: Build core food dataset
        run: node scripts/build-core-db.mjs --usda=data-build/usda

      # The dataset is checked against the raw export it was built from before
      # anything is published. A unit factor on the wrong nutrient would pass
      # every other test in the repo and quietly make every calorie wrong.
      - name: Audit the core dataset
        run: node scripts/audit-core-db.mjs --source=data-build/usda --samples=300

      # The bundled USDA set and the hosted Open Food Facts snapshot are
      # independent, and only one of them is expensive. Rebuilding the core
      # dataset — to pick up a change to the converter, say — took the full
      # four-hour run because the two were welded together. `core-only` skips
      # the gigabyte download and finishes in minutes; the monthly schedule
      # still rebuilds everything.
      - name: Build hosted food database
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'everything'
        run: |
          ARGS="--usda=data-build/usda"
          if [ -n "${{ vars.FOOD_DB_COUNTRIES }}" ]; then
            ARGS="$ARGS --countries=${{ vars.FOOD_DB_COUNTRIES }}"
          fi
          node scripts/build-food-db.mjs $ARGS

      - name: Summarise
        run: |
          echo "### Food data rebuilt" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat public/fooddb/manifest.json 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo '(core dataset only)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Chunks: $(ls public/fooddb 2>/dev/null | grep -c 'sqlite3\.' || echo 0)" >> $GITHUB_STEP_SUMMARY
          du -sh public/data/core-foods.json >> $GITHUB_STEP_SUMMARY
          du -sh public/fooddb 2>/dev/null >> $GITHUB_STEP_SUMMARY || true

      # A fresh key means the deploy workflow's `restore-keys` prefix match
      # picks this up instead of last month's copy.
      - name: Publish to the deploy cache
        uses: actions/cache/save@v4
        with:
          path: |
            public/fooddb
            public/data/core-foods.json
          # A core-only run leaves `public/fooddb` as whatever the restore put
          # there, so the snapshot is carried forward rather than lost.
          key: fooddb-${{ vars.FOOD_DB_VERSION || 'v1' }}-${{ github.run_id }}

      - name: Trigger a redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo ${{ github.repository }}
