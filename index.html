<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0e1015" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="FuelFlow — local-first calorie, macro and micronutrient tracker with adaptive TDEE. Works offline. No account required."
    />
    <title>FuelFlow</title>

    <script>
      // Resolve the theme before the first paint.
      //
      // `data-theme` was hardcoded to "dark" on <html>, so the launch screen was
      // always dark — including for someone whose app is set to light — and the
      // page flashed when React later applied the real setting. The preference
      // lives in IndexedDB, which cannot be read synchronously, so the app
      // mirrors the resolved value into localStorage for this one purpose.
      //
      // Placed after the meta tags so theme-color is present to update.
      (function () {
        var resolved = 'dark';
        try {
          var saved = localStorage.getItem('ff.theme');
          resolved =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
        } catch (e) {
          /* private mode, or storage disabled — dark is the app's default */
        }
        document.documentElement.dataset.theme = resolved;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', resolved === 'dark' ? '#080a0f' : '#f5f7fb');
      })();
    </script>
  </head>
  <body>
    <!--
      Launch screen.

      Inlined rather than rendered by React, because its whole purpose is to be
      on screen *before* any JavaScript has parsed. A cold start otherwise shows
      the bare page background — a black rectangle for as long as the bundle and
      the database take, which is the single clearest tell of a web app.

      It paints from the same tokens as the app, follows the OS theme on its
      own, and is removed by main.tsx once React has committed its first frame.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        /* Flex, not grid: `grid-auto-rows: min-content` sizes the rows to their
           content and stacks them from the top, so `place-items: center` only
           centred them horizontally and the mark sat against the status bar. */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #080a0f;
        transition: opacity 0.28s ease;
      }
      #boot[data-leaving='true'] { opacity: 0; pointer-events: none; }
      @media (prefers-color-scheme: light) {
        html:not([data-theme='dark']) #boot { background: #f5f7fb; }
      }
      html[data-theme='light'] #boot { background: #f5f7fb; }
      #boot-mark {
        width: 76px;
        height: 76px;
        display: grid;
        place-items: center;
        animation: boot-rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      /* The same 270 degree gauge the Today screen opens with, sweeping while
         the app loads — a progress ring that is also the product's own mark. */
      #boot-ring { transform: rotate(-90deg); }
      #boot-ring circle {
        fill: none;
        stroke-width: 5;
        stroke-linecap: round;
      }
      #boot-track { stroke: rgba(148, 163, 184, 0.18); }
      #boot-sweep {
        stroke: url(#boot-grad);
        stroke-dasharray: 150;
        animation: boot-spin 1.15s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        transform-origin: 32px 32px;
      }
      #boot-word {
        font: 600 15px/1 -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #66718a;
        animation: boot-fade 0.6s 0.25s ease both;
      }
      @keyframes boot-spin {
        0% { stroke-dashoffset: 140; transform: rotate(0deg); }
        50% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 140; transform: rotate(360deg); }
      }
      @keyframes boot-rise {
        from { opacity: 0; transform: translateY(8px) scale(0.94); }
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-fade { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-sweep, #boot-mark, #boot-word { animation: none; }
        #boot-sweep { stroke-dashoffset: 60; }
      }
    </style>
    <div id="boot" role="status" aria-label="Loading FuelFlow">
      <div id="boot-mark">
        <svg id="boot-ring" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="boot-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#4f46e5" />
            </linearGradient>
          </defs>
          <circle id="boot-track" cx="32" cy="32" r="26" />
          <circle id="boot-sweep" cx="32" cy="32" r="26" />
        </svg>
      </div>
      <div id="boot-word">FuelFlow</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
