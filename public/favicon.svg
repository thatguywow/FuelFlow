<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"></stop>
      <stop offset="50%" stop-color="#3b82f6"></stop>
      <stop offset="100%" stop-color="#4f46e5"></stop>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.45"></feDropShadow>
    </filter>
  </defs>

  <!-- Glow -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#borderGradient)" filter="url(#glow)"></rect>

  <!-- Gradient border -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#borderGradient)"></rect>

  <!-- Inner panel -->
  <rect x="64" y="64" width="384" height="384" rx="88" fill="#0E1015"></rect>

  <!-- Flame -->
  <g transform="translate(256 256) scale(14) translate(-12 -12)">
    <path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>
</svg>